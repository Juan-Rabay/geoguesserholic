<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas de Metas de GeoGuessr</title>
<meta name="description" content="Guía completa de metas de GeoGuessr, país por país.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://flagcdn.com">
<link rel="stylesheet" href="assets/css/style.css?v=10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<script>
  (function(){try{var t=localStorage.getItem('atlas-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
<body>

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="#topo">
      <span class="brand__mk" aria-hidden="true"></span>
      <span>Atlas<small data-i18n="brandSub">Metas de GeoGuessr</small></span>
    </a>
    <nav class="navlinks" aria-label="•">
      <a href="#paises" data-i18n="navCountries">Países</a>
      <a href="#metas" data-i18n="navMeta">Metas globales</a>
      <a href="#metodo" data-i18n="navMethod">Método</a>
    </nav>
    <div class="langsw" id="langSwitch" role="group" data-i18n-aria="langLabel" aria-label="Idioma"></div>
    <button class="iconbtn" id="theme" type="button" data-i18n-aria="themeLabel" aria-label="Tema">☀</button>
  </div>
</header>

<main id="topo">

  <section class="hero">
    <div class="wrap hero__in">
      <span class="eyebrow" data-i18n="eyebrow">Guía completa · Street View</span>
      <h1><span data-i18n="h1a">Todo país con cobertura,</span> <em data-i18n="h1b">y el detalle que lo delata</em>.</h1>
      <p class="hero__lead" data-i18n="lead"></p>
      <div class="stats">
        <div class="stat"><b id="statCountries">—</b><span data-i18n="statCountries"></span></div>
        <div class="stat"><b id="statRegions">—</b><span data-i18n="statRegions"></span></div>
        <div class="stat"><b id="statLeft">—</b><span data-i18n="statLeft"></span></div>
        <div class="stat"><b id="statGuides">—</b><span data-i18n="statGuides"></span></div>
      </div>
    </div>
  </section>

  <section class="sec" id="paises" style="padding-top:8px">
    <div class="wrap">
      <div class="sechead">
        <div class="sechead__k" data-i18n="kRef"></div>
        <h2 data-i18n="h2Countries"></h2>
        <p data-i18n-html="descCountries"></p>
      </div>
    </div>

    <div class="controls">
      <div class="wrap">
        <div class="search">
          <span class="search__ic" aria-hidden="true">⌕</span>
          <label for="q" style="position:absolute;left:-9999px" data-i18n="searchLabel">Buscar</label>
          <input id="q" type="search" data-i18n-ph="searchPlaceholder" autocomplete="off" spellcheck="false">
          <button class="search__x" id="clearQ" type="button" data-i18n-aria="clearLabel" aria-label="Limpiar">✕</button>
        </div>
        <div class="filters">
          <div class="fgroup" id="fRegion"></div>
          <div class="fgroup">
            <button class="chip" data-k="side" data-v="all" aria-pressed="true" data-i18n="fSideAll"></button>
            <button class="chip" data-k="side" data-v="Direita" aria-pressed="false" data-i18n="fRight"></button>
            <button class="chip" data-k="side" data-v="Esquerda" aria-pressed="false" data-i18n="fLeft"></button>
          </div>
          <div class="fgroup">
            <button class="chip" data-k="dif" data-v="all" aria-pressed="true" data-i18n="fDifAll"></button>
            <button class="chip" data-k="dif" data-v="easy" aria-pressed="false" data-i18n="fEasy"></button>
            <button class="chip" data-k="dif" data-v="mid" aria-pressed="false" data-i18n="fMid"></button>
            <button class="chip" data-k="dif" data-v="hard" aria-pressed="false" data-i18n="fHard"></button>
          </div>
          <span class="count" id="count">—</span>
        </div>
      </div>
    </div>

    <div class="wrap"><div class="grid" id="grid"></div></div>
  </section>

  <section class="sec" id="metas">
    <div class="wrap">
      <div class="sechead">
        <div class="sechead__k" data-i18n="kCross"></div>
        <h2 data-i18n="h2Meta"></h2>
        <p data-i18n="descMeta"></p>
      </div>
      <div class="gcards" id="guides"></div>
    </div>
  </section>

  <section class="sec" id="metodo">
    <div class="wrap">
      <div class="sechead">
        <div class="sechead__k" data-i18n="kHow"></div>
        <h2 data-i18n="h2Method"></h2>
        <p data-i18n="descMethod"></p>
      </div>
      <div class="gcards">
        <article class="gcard"><div class="gcard__flat">
          <div class="gcard__t" data-i18n="m1t"></div>
          <p data-i18n-html="m1b"></p>
        </div></article>
        <article class="gcard"><div class="gcard__flat">
          <div class="gcard__t" data-i18n="m2t"></div>
          <p data-i18n-html="m2b"></p>
        </div></article>
        <article class="gcard"><div class="gcard__flat">
          <div class="gcard__t" data-i18n="m3t"></div>
          <p data-i18n-html="m3b"></p>
        </div></article>
        <article class="gcard"><div class="gcard__flat">
          <div class="gcard__t" data-i18n="m4t"></div>
          <p data-i18n-html="m4b"></p>
        </div></article>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="wrap">
    <p class="note"><b data-i18n="noteT"></b> <span data-i18n="noteB"></span></p>
    <div class="foot__in">
      <p><b data-i18n="footT"></b> — <span data-i18n="footB"></span></p>
      <p class="foot__sc">
        <span data-i18n="shortcuts"></span>
        <b>/</b> <span data-i18n="scSearch"></span> ·
        <b>←</b> <b>→</b> <span data-i18n="scNav"></span> ·
        <b>Esc</b> <span data-i18n="scClose"></span>
      </p>
    </div>
    <p class="credit">Banderas: <a href="https://flagcdn.com" rel="noopener">flagcdn.com</a></p>
  </div>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="panelTitle">
  <div class="panel__hd" id="panelHead"></div>
  <div class="panel__bd" id="panelBody"></div>
</aside>

<button class="totop" id="totop" type="button" data-i18n-aria="topLabel" aria-label="Top">↑</button>

<script src="assets/js/data-europe.js?v=10"></script>
<script src="assets/js/data-asia.js?v=10"></script>
<script src="assets/js/data-africa.js?v=10"></script>
<script src="assets/js/data-americas.js?v=10"></script>
<script src="assets/js/data-oceania.js?v=10"></script>
<script src="assets/js/data-extra.js?v=10"></script>
<script src="assets/js/guides.js?v=10"></script>
<script src="assets/js/guides-i18n.js?v=10"></script>
<script src="assets/js/i18n-ui.js?v=10"></script>
<script src="assets/js/i18n-es.js?v=10"></script>
<script src="assets/js/i18n-en.js?v=10"></script>
<script src="assets/js/app.js?v=10"></script>
</body>
</html>
